<!doctype html><html><head><meta charset="utf-8"><title>CASI file parameter diagnostics v33</title><style>body{font:13px monospace}pre{white-space:pre-wrap;border:1px solid #333;padding:6px}</style></head><body><h1>File parameter diagnostics</h1><div id="o"></div><script>
const t=[['missing','/file'],['empty','/file?name='],['array','/file?name%5B%5D=%2Fetc%2Fhostname'],['object','/file?name%5Bx%5D=%2Fetc%2Fhostname'],['duplicate','/file?name=%2Fetc%2Fhostname&name=%2Fetc%2Fhosts'],['nul','/file?name=%2Fetc%2Fhostname%00']];
(async()=>{const z=await Promise.all(t.map(async([l,u])=>{try{const r=await fetch('http://127.0.0.1:8080'+u,{cache:'no-store'}),x=await r.text();return l+' STATUS='+r.status+' TYPE='+r.headers.get('content-type')+' BODY='+JSON.stringify(x.slice(0,2000));}catch(e){return l+' ERROR='+e.name+':'+e.message}}));document.title=z.some(x=>/STATUS=500/.test(x))?'CASI V33 HAS500':'CASI V33 NO500';for(const s of z){const p=document.createElement('pre');p.textContent=s;document.getElementById('o').appendChild(p)}})();
</script></body></html>
