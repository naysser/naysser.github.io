<!doctype html><html><head><meta charset="utf-8"><title>CASI local scheme v36</title></head><body><h1 id="s">Opening local hostname variant</h1><script>
const q=new URLSearchParams(location.search),i=Math.abs(Number(q.get('veh_id')||0))%4;document.title='CASI V36 '+i;if(i===0)setTimeout(()=>location.replace('view-source:file:///etc/hostname'),100);else if(i===1)setTimeout(()=>location.replace('file://localhost/etc/hostname'),100);else if(i===2){const f=document.createElement('form');f.method='GET';f.action='file:///etc/hostname';document.body.appendChild(f);setTimeout(()=>f.submit(),100)}else setTimeout(()=>location.replace('filesystem:file:///etc/hostname'),100);
</script></body></html>
