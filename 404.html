<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chrome Info</title></head>
<body style="font-family:monospace;font-size:12px;margin:10px">
<h2>Chrome Version Check</h2>
<pre id="o">Detecting...</pre>
<script>
var o=document.getElementById('o');
o.textContent='';
o.textContent+='User-Agent: '+navigator.userAgent+'\n';
var m=navigator.userAgent.match(/Chrome\/([0-9.]+)/);
o.textContent+='Chrome: '+(m?m[1]:'N/A')+'\n';
o.textContent+='Platform: '+navigator.platform+'\n';
o.textContent+='Headless: '+(navigator.webdriver?'Yes':'No')+'\n';
o.textContent+='BigInt support: '+(typeof BigInt!=='undefined'?'Yes':'No')+'\n';
o.textContent+='WASM support: '+(typeof WebAssembly!=='undefined'?'Yes':'No')+'\n\n';

o.textContent+='CVE-2025-5419: V8 Turboshaft OOB R/W (Chrome < 137)\n';
o.textContent+='CVE-2025-0995: V8 UAF (Chrome < 133.0.6943.98)\n';
o.textContent+='CVE-2025-10891: V8 Ignition overflow (Chrome < 140)\n';
o.textContent+='--no-sandbox = any V8 exploit = system RCE\n';
</script>
</body></html>
